<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스트림스 게임 관리자</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jua', sans-serif; background: linear-gradient(135deg, #1e3a8a, #4c1d95); color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-6 min-h-screen overflow-x-hidden">
    
    <h1 class="text-4xl font-bold mb-8 drop-shadow-md">스트림스 관리자 대시보드</h1>
    
    <!-- 1. 방 생성 영역 -->
    <div id="setup-section" class="bg-white/10 p-10 rounded-3xl backdrop-blur-md text-center max-w-lg w-full mt-10">
        <p class="mb-8 text-xl text-indigo-100">새로운 게임 방을 만들어 학생들을 초대하세요.</p>
        <button id="btn-create-room" class="bg-pink-500 hover:bg-pink-400 text-white text-3xl px-10 py-5 rounded-2xl font-bold shadow-[0_8px_0_rgb(190,24,93)] hover:translate-y-1 hover:shadow-[0_4px_0_rgb(190,24,93)] transition-all">
            새 게임 방 만들기
        </button>
    </div>

    <!-- 2. 게임 진행 영역 -->
    <div id="game-section" class="hidden flex-col items-center w-full max-w-6xl mt-4">
        <!-- 왼쪽으로 번호 뽑기 영역을 살짝 밀어주기 위해 justify-start 및 gap 조절 -->
        <div class="flex flex-col lg:flex-row items-center lg:items-start gap-8 w-full justify-start mb-8">
            
            <!-- 왼쪽: 게임 컨트롤 (번호 뽑기 영역) -->
            <div class="flex flex-col items-center lg:w-1/3 shrink-0">
                <div class="flex items-center gap-3 mb-6 text-xl bg-white/20 px-6 py-3 rounded-full backdrop-blur-sm">
                    접속 PIN: <span id="room-pin" class="font-bold text-yellow-300 text-4xl tracking-wider"></span>
                </div>
                
                <div class="h-60 w-60 bg-white rounded-[3rem] shadow-2xl flex items-center justify-center border-8 border-indigo-300 mb-6">
                    <span id="current-number" class="text-[8.5rem] font-bold text-indigo-900 leading-none">?</span>
                </div>
                
                <button id="btn-draw" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 text-3xl px-10 py-5 rounded-3xl font-bold shadow-[0_8px_0_rgb(161,98,7)] hover:translate-y-1 hover:shadow-[0_4px_0_rgb(161,98,7)] transition-all w-full max-w-xs">
                    번호 뽑기 (<span id="draw-count">0</span>/20)
                </button>

                <!-- 다시 하기 버튼 -->
                <button id="btn-reset-game" class="hidden mt-6 bg-green-500 hover:bg-green-400 text-white text-2xl px-8 py-4 rounded-2xl font-bold shadow-[0_6px_0_rgb(21,128,61)] hover:translate-y-1 hover:shadow-[0_3px_0_rgb(21,128,61)] transition-all w-full max-w-xs">
                    🔄 같은 방에서 다시 하기
                </button>
            </div>

            <!-- 오른쪽: 실시간 학생 대시보드 (이름, 점수 열 간격 확장) -->
            <div class="flex-1 w-full bg-white/10 p-6 rounded-3xl backdrop-blur-md h-[480px] overflow-hidden flex flex-col">
                <h2 class="text-2xl mb-4 text-center font-bold text-indigo-100">🏆 실시간 학생 순위표</h2>
                <div class="overflow-y-auto no-scrollbar flex-1 pr-2">
                    <table class="w-full text-center border-collapse table-fixed">
                        <!-- 테이블 각 열의 너비 고정 세팅 -->
                        <colgroup>
                            <col style="width: 12%;"> <!-- 순위 -->
                            <col style="width: 28%;"> <!-- 이름 (간격 넓힘) -->
                            <col style="width: 22%;"> <!-- 점수 (간격 넓힘) -->
                            <col style="width: 38%;"> <!-- 타일 현황 -->
                        </colgroup>
                        <thead class="sticky top-0 bg-[#2e267d] z-10">
                            <tr class="text-lg text-indigo-200">
                                <th class="p-3.5 rounded-tl-xl">순위</th>
                                <th class="p-3.5 text-left pl-6">이름</th>
                                <th class="p-3.5">점수</th>
                                <th class="p-3.5 rounded-tr-xl">타일 현황 (20칸)</th>
                            </tr>
                        </thead>
                        <tbody id="player-list">
                            <tr><td colspan="4" class="p-8 text-gray-300 text-lg">아직 입장한 학생이 없습니다.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ★ [필수] 본인의 firebaseConfig로 교체하세요! ★
        const firebaseConfig = {
    apiKey: "AIzaSyC_R6-EMFx9H_L4Pp0lJWUj5rzZ_ZtCg0g",
    authDomain: "streams-game-8b9ef.firebaseapp.com",
    databaseURL: "https://streams-game-8b9ef-default-rtdb.firebaseio.com",
    projectId: "streams-game-8b9ef",
    storageBucket: "streams-game-8b9ef.firebasestorage.app",
    messagingSenderId: "688248392489",
    appId: "1:688248392489:web:c6576aaab9ae71b1c74538",
    measurementId: "G-QC5ZWVRRL3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const baseTiles = [
            ...Array.from({length: 10}, (_, i) => i + 1),
            ...Array.from({length: 9}, (_, i) => i + 11),
            ...Array.from({length: 9}, (_, i) => i + 11),
            ...Array.from({length: 11}, (_, i) => i + 20),
            '★'
        ];

        let availableTiles = [];
        let currentPin = "";
        let drawCount = 0;

        const setupSection = document.getElementById('setup-section');
        const gameSection = document.getElementById('game-section');
        const roomPinEl = document.getElementById('room-pin');
        const currentNumberEl = document.getElementById('current-number');
        const drawCountEl = document.getElementById('draw-count');
        const btnCreateRoom = document.getElementById('btn-create-room');
        const btnDraw = document.getElementById('btn-draw');
        const btnResetGame = document.getElementById('btn-reset-game');
        const playerListEl = document.getElementById('player-list');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        btnCreateRoom.addEventListener('click', async () => {
            currentPin = Math.floor(1000 + Math.random() * 9000).toString();
            availableTiles = [...baseTiles];
            shuffle(availableTiles);
            drawCount = 0;

            await set(ref(db, 'rooms/' + currentPin), {
                status: 'waiting',
                drawnNumbers: [],
                players: {} 
            });

            setupSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            gameSection.classList.add('flex');
            roomPinEl.textContent = currentPin;

            onValue(ref(db, `rooms/${currentPin}/players`), (snapshot) => {
                playerListEl.innerHTML = '';
                
                if (!snapshot.exists()) {
                    playerListEl.innerHTML = `<tr><td colspan="4" class="p-8 text-gray-300 text-lg">아직 입장한 학생이 없습니다.</td></tr>`;
                    return;
                }

                const playersData = snapshot.val();
                const playersArray = Object.values(playersData);
                playersArray.sort((a, b) => b.score - a.score);

                playersArray.forEach((player, index) => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-white/10 hover:bg-white/5 transition-colors";

                    let boardHtml = `<div class="flex gap-1 justify-center py-2">`;
                    if (player.board) {
                        player.board.forEach(tile => {
                            if (tile === null) {
                                boardHtml += `<div class="w-5 h-5 bg-white/20 rounded-sm text-[10px] flex items-center justify-center text-transparent">.</div>`;
                            } else if (tile === '★') {
                                boardHtml += `<div class="w-5 h-5 bg-yellow-400 text-yellow-900 rounded-sm font-bold text-[12px] flex items-center justify-center">★</div>`;
                            } else {
                                boardHtml += `<div class="w-5 h-5 bg-white text-indigo-900 rounded-sm font-bold text-[11px] flex items-center justify-center">${tile}</div>`;
                            }
                        });
                    }
                    boardHtml += `</div>`;

                    let rankDisplay = `${index + 1}`;
                    if (index === 0) rankDisplay = '🥇';
                    else if (index === 1) rankDisplay = '🥈';
                    else if (index === 2) rankDisplay = '🥉';

                    tr.innerHTML = `
                        <td class="p-3.5 text-2xl font-bold">${rankDisplay}</td>
                        <td class="p-3.5 text-xl font-bold text-left pl-6 truncate">${player.name}</td>
                        <td class="p-3.5 text-2xl font-bold text-yellow-300">${player.score}점</td>
                        <td class="p-3.5">${boardHtml}</td>
                    `;
                    playerListEl.appendChild(tr);
                });
            });
        });

        btnDraw.addEventListener('click', async () => {
            if (drawCount >= 20) return;

            const drawnTile = availableTiles.pop();
            currentNumberEl.textContent = drawnTile;
            currentNumberEl.className = drawnTile === '★' 
                ? 'text-[8.5rem] font-bold text-yellow-400 leading-none drop-shadow-lg' 
                : 'text-[8.5rem] font-bold text-indigo-900 leading-none';
            
            const drawnRef = ref(db, `rooms/${currentPin}/drawnNumbers/${drawCount}`);
            await set(drawnRef, drawnTile);
            
            drawCount++;
            drawCountEl.textContent = drawCount;
            await update(ref(db, `rooms/${currentPin}`), { status: 'playing' });

            if (drawCount >= 20) {
                btnDraw.disabled = true;
                btnDraw.classList.add('opacity-50', 'cursor-not-allowed');
                btnResetGame.classList.remove('hidden');
                setTimeout(() => alert("20개의 타일을 모두 뽑았습니다! 최종 랭킹을 확인하세요."), 500);
            }
        });

        btnResetGame.addEventListener('click', async () => {
            availableTiles = [...baseTiles];
            shuffle(availableTiles);
            drawCount = 0;

            currentNumberEl.textContent = "?";
            currentNumberEl.className = 'text-[8.5rem] font-bold text-indigo-900 leading-none';
            drawCountEl.textContent = drawCount;
            
            btnDraw.disabled = false;
            btnDraw.classList.remove('opacity-50', 'cursor-not-allowed');
            btnResetGame.classList.add('hidden');

            const updates = {};
            updates[`rooms/${currentPin}/status`] = 'waiting';
            updates[`rooms/${currentPin}/drawnNumbers`] = null;

            const playersSnapshot = await get(ref(db, `rooms/${currentPin}/players`));
            if (playersSnapshot.exists()) {
                const players = playersSnapshot.val();
                for (const playerName in players) {
                    updates[`rooms/${currentPin}/players/${playerName}/board`] = Array(20).fill(null);
                    updates[`rooms/${currentPin}/players/${playerName}/score`] = 0;
                }
            }

            await update(ref(db), updates);
            alert("게임이 초기화되었습니다! 학생들이 이어서 바로 진행할 수 있습니다.");
        });
    </script>
</body>
</html>
